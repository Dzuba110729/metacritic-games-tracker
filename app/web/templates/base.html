<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyCacheSize": 0}'>
  <title>{% block title %}Новинки Metacritic{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">мк</span>
        <span class="brand__name">Новинки Metacritic</span>
      </a>
      <nav class="topnav" aria-label="Разделы">
        <a href="/"{% if request.url.path == "/" %} aria-current="page"{% endif %}>Все игры</a>
        <a href="/monitor"{% if request.url.path.startswith("/monitor") %} aria-current="page"{% endif %}>Мониторинг</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    Оценки и отзывы — с metacritic.com. Резюме отзывов пишет нейросеть Claude.
  </footer>
</body>
</html>
