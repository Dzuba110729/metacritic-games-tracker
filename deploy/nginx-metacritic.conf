# /etc/nginx/sites-available/metacritic — сайт 188-130-141-107.sslip.io.
# Блоки listen 443 и ssl_certificate certbot добавляет сам (certbot --nginx).
server {
    listen 80;
    listen [::]:80;
    server_name 188-130-141-107.sslip.io;

    # Пароль на весь сайт. Файл создаётся вручную: openssl passwd -apr1.
    auth_basic "Metacritic Games Tracker";
    auth_basic_user_file /etc/nginx/.htpasswd-metacritic;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Живой монитор (SSE): ответ идёт потоком, буферизация его ломает.
    location /monitor/stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
