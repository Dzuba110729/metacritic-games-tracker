# Боевой запуск на общем VPS. Запуск только через scripts/deploy.sh:
#   docker compose -p metacritic -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# docker-compose.override.yml при этом не подключается.
services:
  app:
    ports:
      # Только локально: снаружи сайт доступен через nginx с Basic Auth.
      # 8000 занят другим сервисом на сервере.
      - "127.0.0.1:8001:8000"
    environment:
      # Запросы от nginx приходят через шлюз Docker-сети. Без этого uvicorn не верит
      # X-Forwarded-Proto и строит ссылки на статику как http:// — браузер их блокирует.
      FORWARDED_ALLOW_IPS: "172.30.0.1"
    networks:
      - metacritic
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  metacritic:
    name: metacritic_net
    ipam:
      config:
        # Явная подсеть, не пересекается с уже занятыми на сервере.
        - subnet: 172.30.0.0/24
